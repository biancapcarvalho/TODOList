<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <!-- para usar icones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>TODO List</title>
</head>
<body>
    <div id="main-div">
        <div id="header-div">
            <h2>TODO List</h2>
            <p>por Bianca Carvalho</p>
        </div>

        <div id="tasks-div">
            <div>
                <h2>
                    Tarefas
                </h2>
            </div>
            <div id="task-list-div">
                <div id="todo-tasks" class="status-column">
                    <div class="column-title">
                        <p>A FAZER</p>
                        <i class="fa-regular fa-plus"></i>
                    </div>
                    <!-- todo - um laço para adicionar os cards de tarefa aqui -->
                    <div class="task-mini-card">
                        <div>
                            <div class="header-task">
                                <p>titulo</p>
                                <div>
                                    <i class="fa-regular fa-pen-to-square"></i>
                                    <i class="fa-solid fa-trash"></i>
                                </div>
                            </div>
                            <div class="footer-task">
                                <div>
                                    <p class="due-date">
                                        <i class="fa-regular fa-clock"></i>
                                        dd/mm/aaaa
                                    </p>
                                    <p class="category">categoria</p>
                                </div>
                                <p class="priority">
                                    <i class="fa-solid fa-angles-down" style="color: dodgerblue"></i>
                                    <!--
                                        1 angles-down
                                        2 angle-down
                                        3 equals
                                        4 angle-top
                                        5 angles-top
                                     -->
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="doing-tasks" class="status-column">
                    <div class="column-title">
                        <p>EM PROGRESSO</p>
                        <i class="fa-regular fa-plus"></i>
                    </div>
                    <!-- todo - um laço para adicionar os cards de tarefa aqui -->
                    <div class="task-mini-card">
                        <div>
                            <div class="header-task">
                                <p>titulo</p>
                                <div>
                                    <i class="fa-regular fa-pen-to-square"></i>
                                    <i class="fa-solid fa-trash"></i>
                                </div>
                            </div>
                            <div class="footer-task">
                                <div>
                                    <p class="due-date">
                                        <i class="fa-regular fa-clock"></i>
                                        dd/mm/aaaa
                                    </p>
                                    <p class="category">categoria</p>
                                </div>
                                <p class="priority">
                                    <i class="fa-solid fa-angles-down" style="color: dodgerblue"></i>
                                    <!--
                                        1 angles-down
                                        2 angle-down
                                        3 equals
                                        4 angle-top
                                        5 angles-top
                                     -->
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="done-tasks" class="status-column">
                    <div class="column-title">
                        <p>CONCLUÍDO</p>
                        <i class="fa-regular fa-plus"></i>
                    </div>
                    <!-- todo - um laço para adicionar os cards de tarefa aqui -->
                    <div class="task-mini-card">
                        <div>
                            <div class="header-task">
                                <p>titulo</p>
                                <div>
                                    <i class="fa-regular fa-pen-to-square"></i>
                                    <i class="fa-solid fa-trash"></i>
                                </div>
                            </div>
                            <div class="footer-task">
                                <div>
                                    <p class="due-date">
                                        <i class="fa-regular fa-clock"></i>
                                        dd/mm/aaaa
                                    </p>
                                    <p class="category">categoria</p>
                                </div>
                                <p class="priority">
                                    <i class="fa-solid fa-angles-down" style="color: dodgerblue"></i>
                                    <!--
                                        1 angles-down
                                        2 angle-down
                                        3 equals
                                        4 angle-top
                                        5 angles-top
                                     -->
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
